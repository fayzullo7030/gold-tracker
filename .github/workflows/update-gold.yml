name: Update gold prices

on:
  schedule:
    # 10:30 Asia/Tashkent (UTC+5)
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update gold price
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from html.parser import HTMLParser

          URL = "https://cbu.uz/ru/banknotes-coins/gold-bars/prices/"

          class TableParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
                  self.row = None
                  self.cell = None

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()

                  if tag == "tr":
                      self.row = []

                  elif tag in ("td", "th") and self.row is not None:
                      self.cell = []

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  tag = tag.lower()

                  if tag in ("td", "th") and self.cell is not None:
                      value = " ".join(self.cell)
                      value = html.unescape(value)
                      value = re.sub(r"\s+", " ", value).strip()

                      self.row.append(value)
                      self.cell = None

                  elif tag == "tr" and self.row is not None:
                      self.rows.append(self.row)
                      self.row = None
                      self.cell = None

          def normalize(value):
              value = html.unescape(value)
              value = value.replace("\xa0", " ")
              value = value.replace("\u202f", " ")
              value = value.replace("\u200b", "")
              return re.sub(r"\s+", " ", value).strip().lower()

          def to_int(value):
              digits = re.sub(r"\D", "", value)

              if not digits:
                  raise ValueError(
                      f"Не удалось преобразовать цену: {value!r}"
                  )

              return int(digits)

          print("Получаю данные ЦБ...")

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0 GoldTracker/1.0",
                  "Accept-Language": "ru-RU,ru;q=0.9,en;q=0.8"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              page = response.read().decode("utf-8", "replace")

          print("Страница ЦБ получена.")

          # Способ 1: извлекаем цены непосредственно из строки таблицы.
          parser = TableParser()
          parser.feed(page)

          prices = None

          for row in parser.rows:
              for index, cell in enumerate(row):
                  cell_text = normalize(cell)

                  if re.fullmatch(r"5\s*грамм", cell_text):
                      values = []

                      for price_cell in row[index + 1:]:
                          if re.search(r"\d", price_cell):
                              values.append(to_int(price_cell))

                      if len(values) >= 3:
                          prices = values[:3]
                          break

              if prices:
                  break

          # Способ 2: резервный поиск в текстовом содержимом страницы.
          if not prices:
              print("Табличный поиск не сработал. Использую резервный поиск...")

              text = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  page,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(r"<[^>]+>", " ", text)
              text = html.unescape(text)
              text = normalize(text)

              match = re.search(r"5\s*грамм", text)

              if match:
                  segment = text[match.end():match.end() + 500]

                  amounts = re.findall(
                      r"(\d[\d\s\u00a0\u202f.,]*?)\s*сум",
                      segment,
                      flags=re.I
                  )

                  if len(amounts) >= 3:
                      prices = [to_int(x) for x in amounts[:3]]

          if not prices:
              raise RuntimeError(
                  "Не удалось извлечь цены 5-граммового слитка. "
                  "Проверьте актуальную структуру страницы ЦБ."
              )

          # Порядок колонок ЦБ:
          # 1. Цена продажи
          # 2. Обратный выкуп в неповреждённой упаковке
          # 3. Обратный выкуп в повреждённой упаковке
          sell, buy, buy_damaged = prices

          if not (1_000_000 <= sell <= 100_000_000):
              raise RuntimeError(f"Подозрительная цена продажи: {sell}")

          if not (1_000_000 <= buy <= 100_000_000):
              raise RuntimeError(f"Подозрительная цена выкупа: {buy}")

          now = datetime.now(ZoneInfo("Asia/Tashkent"))

          row = {
              "date": now.strftime("%Y-%m-%d"),
              "time": now.strftime("%H:%M"),
              "sell": sell,
              "buy": buy
          }

          print(f"Дата проверки: {row['date']} {row['time']}")
          print(f"Цена продажи: {sell:,} сум")
          print(f"Обратный выкуп: {buy:,} сум")
          print(f"Выкуп повреждённого слитка: {buy_damaged:,} сум")

          try:
              with open("data.json", "r", encoding="utf-8") as file:
                  data = json.load(file)
          except FileNotFoundError:
              data = {
                  "source": URL,
                  "history": []
              }

          # Одна запись на день.
          # Повторный запуск заменяет запись за текущую дату.
          history = [
              item for item in data.get("history", [])
              if item.get("date") != row["date"]
          ]

          history.append(row)
          history.sort(key=lambda item: item.get("date", ""))

          data["source"] = URL
          data["updated"] = now.isoformat()
          data["history"] = history

          with open("data.json", "w", encoding="utf-8") as file:
              json.dump(
                  data,
                  file,
                  ensure_ascii=False,
                  indent=2
              )
              file.write("\n")

          print("data.json успешно обновлён.")
          PY

      - name: Commit and push
        run: |
          git config user.name "gold-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Изменений в data.json нет."
          else
            git commit -m "Update gold price"
            git push
          fi
