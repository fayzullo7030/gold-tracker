name: Update gold prices

on:
  schedule:
    # 10:30 Asia/Tashkent (UTC+5)
    - cron: "30 5 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update gold price
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          URL = "https://cbu.uz/ru/banknotes-coins/gold-bars/prices/"

          print("Получаю данные ЦБ...")

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0 GoldTracker/1.0"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", "ignore")

          print("Страница ЦБ получена.")

          # Удаляем служебные блоки HTML
          text = re.sub(
              r"<script\b[^>]*>.*?</script>",
              " ",
              html,
              flags=re.I | re.S
          )

          text = re.sub(
              r"<style\b[^>]*>.*?</style>",
              " ",
              text,
              flags=re.I | re.S
          )

          # Удаляем HTML-теги
          text = re.sub(r"<[^>]+>", " ", text)

          # Нормализуем пробелы
          text = re.sub(r"\s+", " ", text).strip()

          print("Ищу цену 5-граммового слитка...")

          # Ищем строку:
          # 5 грамм | цена продажи | обратный выкуп |
          #
          # ВАЖНО:
          # дата обновления ЦБ здесь НЕ проверяется.

          pattern = (
              r"5\s*грамм\s+"
              r"([\d\s\u00a0]+)\s*сум\s+"
              r"([\d\s\u00a0]+)\s*сум\s+"
              r"([\d\s\u00a0]+)\s*сум"
          )

          match = re.search(pattern, text, re.I)

          if not match:
              raise RuntimeError(
                  "Не удалось найти строку с ценами 5-граммового "
                  "золотого слитка на странице ЦБ."
              )

          def to_int(value):
              digits = re.sub(r"\D", "", value)

              if not digits:
                  raise ValueError(
                      f"Не удалось преобразовать значение в число: {value!r}"
                  )

              return int(digits)

          sell = to_int(match.group(1))
          buy = to_int(match.group(2))

          # Защита от случайного парсинга мусора
          if sell < 1_000_000 or buy < 1_000_000:
              raise RuntimeError(
                  f"Получены подозрительные значения: "
                  f"sell={sell}, buy={buy}"
              )

          now = datetime.now(ZoneInfo("Asia/Tashkent"))

          row = {
              "date": now.strftime("%Y-%m-%d"),
              "time": now.strftime("%H:%M"),
              "sell": sell,
              "buy": buy
          }

          print(f"Дата проверки: {row['date']} {row['time']}")
          print(f"Цена продажи: {sell:,} сум")
          print(f"Обратный выкуп: {buy:,} сум")

          # Загружаем существующую историю
          try:
              with open("data.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {
                  "source": URL,
                  "history": []
              }

          # Одна запись на день.
          # Если workflow запускается повторно в тот же день,
          # сегодняшняя запись заменяется.
          history = [
              x for x in data.get("history", [])
              if x.get("date") != row["date"]
          ]

          history.append(row)

          # Сначала старые даты, в конце сегодняшняя
          history.sort(key=lambda x: x.get("date", ""))

          data["source"] = URL
          data["updated"] = now.isoformat()
          data["history"] = history

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print("data.json успешно обновлён.")
          PY

      - name: Commit and push
        run: |
          git config user.name "gold-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Изменений в data.json нет."
          else
            git commit -m "Update gold price"
            git push
          fi
