name: Update gold prices

on:
  schedule:
    # 10:05 Asia/Tashkent = 05:05 UTC
    - cron: "5 5 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update gold price
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          URL = "https://cbu.uz/ru/banknotes-coins/gold-bars/prices/"

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          html = urllib.request.urlopen(req, timeout=30).read().decode(
              "utf-8", "ignore"
          )

          # Убираем scripts/styles/HTML
          text = re.sub(
              r"<script\b[^>]*>.*?</script>",
              " ",
              html,
              flags=re.I | re.S
          )

          text = re.sub(
              r"<style\b[^>]*>.*?</style>",
              " ",
              text,
              flags=re.I | re.S
          )

          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text)

          # -----------------------------------------
          # 1. Получаем дату и время обновления ЦБ
          # -----------------------------------------

          date_match = re.search(
              r"Дата обновления:\s*"
              r"(\d{1,2})\s+"
              r"(янв|фев|мар|апр|май|июн|июл|авг|сен|окт|ноя|дек)"
              r"\s+(\d{4}),\s*(\d{2}:\d{2})",
              text,
              re.I
          )

          if not date_match:
              raise Exception(
                  "Не удалось найти 'Дата обновления' на сайте ЦБ"
              )

          day = int(date_match.group(1))
          month_name = date_match.group(2).lower()
          year = int(date_match.group(3))
          update_time = date_match.group(4)

          months = {
              "янв": 1,
              "фев": 2,
              "мар": 3,
              "апр": 4,
              "май": 5,
              "июн": 6,
              "июл": 7,
              "авг": 8,
              "сен": 9,
              "окт": 10,
              "ноя": 11,
              "дек": 12
          }

          update_date = datetime(
              year,
              months[month_name],
              day
          ).strftime("%Y-%m-%d")

          # -----------------------------------------
          # 2. Получаем строку 5 грамм
          # -----------------------------------------

          match = re.search(
              r"5\s*грамм\s+"
              r"([\d\s\u00a0]+)\s*сум\s+"
              r"([\d\s\u00a0]+)\s*сум",
              text,
              re.I
          )

          if not match:
              raise Exception(
                  "Не удалось найти строку 5 грамм"
              )

          def num(value):
              return int(re.sub(r"\D", "", value))

          sell = num(match.group(1))
          buy = num(match.group(2))

          if sell <= 0 or buy <= 0:
              raise Exception(
                  f"Некорректные значения: {sell}, {buy}"
              )

          # -----------------------------------------
          # 3. Сохраняем именно дату ЦБ
          # -----------------------------------------

          row = {
              "date": update_date,
              "time": update_time,
              "sell": sell,
              "buy": buy
          }

          with open("data.json", encoding="utf-8") as f:
              data = json.load(f)

          history = [
              x for x in data.get("history", [])
              if x.get("date") != update_date
          ]

          history.append(row)
          history.sort(key=lambda x: x["date"])

          data["history"] = history
          data["source"] = URL

          now = datetime.now(
              ZoneInfo("Asia/Tashkent")
          )

          data["checked"] = now.isoformat()

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print("Дата ЦБ:", update_date)
          print("Время ЦБ:", update_time)
          print("Продажа 5 г:", sell)
          print("Выкуп 5 г:", buy)
          PY

      - name: Save data
        run: |
          git config user.name "gold-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || \
            git commit -m "Update gold price"

          git push
