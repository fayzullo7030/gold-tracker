name: Update gold prices

on:
  schedule:
    # 10:05 по Ташкенту (UTC+5)
    - cron: "5 5 * * *"

  # Возможность запустить вручную из GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get gold prices from CBU
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          URL = "https://cbu.uz/ru/banknotes-coins/gold-bars/prices/"

          print("Получаю данные ЦБ...")

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; GoldTracker/1.0)"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", "ignore")

          # Удаляем scripts и styles
          text = re.sub(
              r"<script\b[^>]*>.*?</script>",
              " ",
              html,
              flags=re.I | re.S
          )

          text = re.sub(
              r"<style\b[^>]*>.*?</style>",
              " ",
              text,
              flags=re.I | re.S
          )

          # Удаляем HTML-теги
          text = re.sub(r"<[^>]+>", " ", text)

          # Нормализуем пробелы
          text = text.replace("\xa0", " ")
          text = re.sub(r"\s+", " ", text).strip()

          print("Страница ЦБ получена.")

          # -------------------------------------------------
          # 1. Находим ФАКТИЧЕСКУЮ дату и время обновления ЦБ
          # -------------------------------------------------

          date_pattern = re.compile(
              r"Дата\s+обновления\s*:\s*"
              r"(\d{1,2})\s+"
              r"(янв|фев|мар|апр|май|июн|июл|авг|сен|окт|ноя|дек)"
              r"\s+(\d{4})\s*,\s*"
              r"(\d{2}:\d{2})",
              re.I
          )

          date_match = date_pattern.search(text)

          if not date_match:
              raise RuntimeError(
                  "ОШИБКА: не найдена строка 'Дата обновления' на странице ЦБ."
              )

          day = int(date_match.group(1))
          month_name = date_match.group(2).lower()
          year = int(date_match.group(3))
          update_time = date_match.group(4)

          months = {
              "янв": 1,
              "фев": 2,
              "мар": 3,
              "апр": 4,
              "май": 5,
              "июн": 6,
              "июл": 7,
              "авг": 8,
              "сен": 9,
              "окт": 10,
              "ноя": 11,
              "дек": 12
          }

          if month_name not in months:
              raise RuntimeError(
                  f"ОШИБКА: неизвестный месяц: {month_name}"
              )

          update_date = f"{year:04d}-{months[month_name]:02d}-{day:02d}"

          cbu_updated = (
              f"{update_date}T{update_time}:00+05:00"
          )

          print(f"Дата обновления ЦБ: {update_date}")
          print(f"Время обновления ЦБ: {update_time}")

          # -------------------------------------------------
          # 2. Находим строку именно для 5 грамм
          # -------------------------------------------------

          # После "5 грамм" ожидаем:
          # цена продажи
          # цена обратного выкупа целой упаковки
          #
          # Между ними могут быть |, пробелы, HTML-разметка и т.п.

          gold_pattern = re.compile(
              r"5\s*грамм"
              r".{0,300}?"
              r"([\d][\d\s]*)\s*сум"
              r".{0,150}?"
              r"([\d][\d\s]*)\s*сум",
              re.I
          )

          gold_match = gold_pattern.search(text)

          if not gold_match:
              raise RuntimeError(
                  "ОШИБКА: не найдена строка с ценой золота 5 грамм."
              )

          def to_number(value):
              return int(re.sub(r"\D", "", value))

          sell = to_number(gold_match.group(1))
          buy = to_number(gold_match.group(2))

          if sell <= 0:
              raise RuntimeError(
                  f"ОШИБКА: некорректная цена продажи: {sell}"
              )

          if buy <= 0:
              raise RuntimeError(
                  f"ОШИБКА: некорректная цена обратного выкупа: {buy}"
              )

          print(f"5 г — продажа: {sell:,}".replace(",", " "))
          print(f"5 г — обратный выкуп: {buy:,}".replace(",", " "))

          # -------------------------------------------------
          # 3. Загружаем существующий data.json
          # -------------------------------------------------

          with open("data.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          history = data.get("history", [])

          # -------------------------------------------------
          # 4. Создаём запись по дате ЦБ
          # -------------------------------------------------

          new_record = {
              "date": update_date,
              "time": update_time,
              "sell": sell,
              "buy": buy
          }

          # Удаляем старую запись за тот же день,
          # чтобы не было дублей.
          history = [
              item
              for item in history
              if item.get("date") != update_date
          ]

          history.append(new_record)

          # Сортировка истории по дате
          history.sort(
              key=lambda item: (
                  item.get("date", ""),
                  item.get("time", "")
              )
          )

          # -------------------------------------------------
          # 5. Сохраняем данные
          # -------------------------------------------------

          data["source"] = URL

          # Это именно время обновления ЦБ
          data["updated"] = cbu_updated

          # Это техническое время проверки GitHub
          data["checked"] = datetime.now(
              ZoneInfo("Asia/Tashkent")
          ).isoformat()

          data["history"] = history

          with open("data.json", "w", encoding="utf-8") as file:
              json.dump(
                  data,
                  file,
                  ensure_ascii=False,
                  indent=2
              )
              file.write("\n")

          print("data.json успешно обновлён.")

          PY

      - name: Commit and push
        run: |
          git config user.name "gold-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Update gold price"
            git push
          fi
