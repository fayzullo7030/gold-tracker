name: Update gold prices

on:
  schedule:
    # Каждый день утром по времени Узбекистана (UTC+5)
    - cron: "0 5 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get gold prices from CBU
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone, timedelta

          URL = "https://cbu.uz/ru/banknotes-coins/gold-bars/info/"

          print("Получаю данные ЦБ...")

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (Linux; Android 10) "
                      "AppleWebKit/537.36 Chrome/120 Safari/537.36"
                  ),
                  "Accept-Language": "ru-RU,ru;q=0.9,en;q=0.8"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", errors="ignore")

          print("Страница ЦБ получена.")

          # ---------------------------------------------------------
          # Убираем HTML-разметку, чтобы искать данные в обычном тексте
          # ---------------------------------------------------------

          text = re.sub(r"<script\b[^>]*>.*?</script>", " ", html,
                        flags=re.I | re.S)
          text = re.sub(r"<style\b[^>]*>.*?</style>", " ", text,
                        flags=re.I | re.S)
          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"&nbsp;", " ", text, flags=re.I)
          text = re.sub(r"&amp;", "&", text, flags=re.I)
          text = re.sub(r"\s+", " ", text).strip()

          # ---------------------------------------------------------
          # 1. Ищем дату обновления ЦБ
          # ---------------------------------------------------------

          date_patterns = [
              r"Дата\s+обновления\s*[:\-]?\s*"
              r"(\d{1,2}\s+[А-Яа-яЁё]+\s+20\d{2})",

              r"Дата\s+обновления\s*[:\-]?\s*"
              r"(\d{1,2}[./-]\d{1,2}[./-]20\d{2})",

              r"Дата\s+обновления\s*[:\-]?\s*"
              r"(\d{4}-\d{2}-\d{2})"
          ]

          update_date = None

          for pattern in date_patterns:
              match = re.search(pattern, text, re.I)
              if match:
                  update_date = match.group(1).strip()
                  break

          if update_date:
              print("Дата обновления ЦБ:", update_date)
          else:
              print(
                  "Предупреждение: дата обновления ЦБ не найдена. "
                  "Продолжаю поиск цены."
              )

          # ---------------------------------------------------------
          # 2. Ищем строку для слитка 5 г
          # ---------------------------------------------------------

          # Возможные варианты записи цены:
          # 9 045 000
          # 9 045 000
          # 9045000
          # 9,045,000

          number = r"[\d\s\u00A0.,]+"

          patterns_5g = [
              # 5 г ... продажа ... выкуп
              rf"5\s*г(?:рамм(?:а|ов)?)?.{{0,1000}}?"
              rf"({number})\s*(?:сум|UZS)?.{{0,300}}?"
              rf"({number})\s*(?:сум|UZS)?",

              # Если в таблице сначала указан вес, затем цены
              rf"5\s*гр?\.?.{{0,500}}?({number}).{{0,300}}?({number})"
          ]

          sell = None
          buy = None

          def clean_number(value):
              value = value.replace("\u00A0", "")
              value = value.replace(" ", "")
              value = value.replace(",", "")
              value = value.replace(".", "")
              return int(value)

          for pattern in patterns_5g:
              match = re.search(pattern, text, re.I)

              if not match:
                  continue

              try:
                  a = clean_number(match.group(1))
                  b = clean_number(match.group(2))

                  # Отбрасываем явно нереалистичные значения
                  candidates = [a, b]

                  candidates = [
                      x for x in candidates
                      if 1_000_000 <= x <= 100_000_000
                  ]

                  if len(candidates) == 2:
                      # В таблице ЦБ цена продажи выше цены выкупа
                      sell = max(candidates)
                      buy = min(candidates)
                      break

              except Exception:
                  pass

          # ---------------------------------------------------------
          # 3. Дополнительный поиск по HTML,
          #    если обычный текст не сработал
          # ---------------------------------------------------------

          if sell is None or buy is None:

              # Ищем фрагменты вокруг "5 г"
              positions = [
                  m.start()
                  for m in re.finditer(r"5\s*(?:г|гр|грамм)",
                                        html, re.I)
              ]

              for pos in positions:
                  fragment = html[max(0, pos - 300):pos + 2500]

                  nums = re.findall(
                      r"\b\d{1,3}(?:[\s\u00A0.,]\d{3})+\b|\b\d{7,8}\b",
                      fragment
                  )

                  values = []

                  for n in nums:
                      try:
                          v = clean_number(n)
                          if 1_000_000 <= v <= 100_000_000:
                              values.append(v)
                      except Exception:
                          pass

                  # Берём уникальные значения
                  values = list(dict.fromkeys(values))

                  if len(values) >= 2:
                      sell = max(values)
                      buy = min(values)
                      break

          if sell is None or buy is None:
              raise RuntimeError(
                  "Не удалось определить цены для слитка 5 г "
                  "на странице ЦБ. Структура страницы могла измениться."
              )

          print("Продажа 5 г:", sell)
          print("Выкуп 5 г:", buy)

          # ---------------------------------------------------------
          # 4. Сохраняем данные
          # ---------------------------------------------------------

          uzbekistan_tz = timezone(timedelta(hours=5))
          checked_at = datetime.now(uzbekistan_tz).isoformat()

          data = {
              "source": URL,
              "updated": checked_at,
              "cbu_update_date": update_date,
              "history": []
          }

          try:
              with open("data.json", "r", encoding="utf-8") as f:
                  old = json.load(f)

              if isinstance(old, dict):
                  data["history"] = old.get("history", [])

          except (FileNotFoundError, json.JSONDecodeError):
              pass

          new_record = {
              "date": checked_at[:10],
              "time": checked_at[11:16],
              "cbu_update_date": update_date,
              "sell": sell,
              "buy": buy
          }

          # Не создаём дубликаты при повторном запуске в тот же день
          existing_today = False

          for item in data["history"]:
              if (
                  item.get("date") == new_record["date"]
                  and item.get("cbu_update_date") == update_date
              ):
                  existing_today = True
                  break

          if not existing_today:
              data["history"].append(new_record)

          # Последние 90 записей
          data["history"] = data["history"][-90:]

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("data.json обновлён.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Изменений нет — commit не требуется."
            exit 0
          fi

          git commit -m "Update gold prices"
          git push
