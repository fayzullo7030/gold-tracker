name: Update gold prices

on:
  schedule:
    - cron: "5 5 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update data
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          URL = "https://cbu.uz/ru/banknotes-coins/gold-bars/prices/"

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          html = urllib.request.urlopen(req, timeout=30).read().decode(
              "utf-8", "ignore"
          )

          text = re.sub(
              r"<script\b[^>]*>.*?</script>",
              " ",
              html,
              flags=re.I | re.S
          )

          text = re.sub(
              r"<style\b[^>]*>.*?</style>",
              " ",
              text,
              flags=re.I | re.S
          )

          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text)

          match = re.search(
              r"5\s*грамм\s+([\d\s\u00a0]+)\s*сум\s+"
              r"([\d\s\u00a0]+)\s*сум",
              text,
              re.I
          )

          if not match:
              raise Exception("Не найдена строка 5 грамм")

          def num(x):
              return int(re.sub(r"\D", "", x))

          sell = num(match.group(1))
          buy = num(match.group(2))

          if sell <= 0 or buy <= 0:
              raise Exception(
                  f"Некорректные значения: {sell}, {buy}"
              )

          now = datetime.now(ZoneInfo("Asia/Tashkent"))

          row = {
              "date": now.strftime("%Y-%m-%d"),
              "time": now.strftime("%H:%M"),
              "sell": sell,
              "buy": buy
          }

          with open("data.json", encoding="utf-8") as f:
              data = json.load(f)

          history = [
              x for x in data.get("history", [])
              if x.get("date") != row["date"]
          ]

          history.append(row)
          history.sort(key=lambda x: x["date"])

          data["history"] = history
          data["source"] = URL
          data["updated"] = now.isoformat()

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print(f"Обновлено: {row['date']} {row['time']}")
          print(f"Продажа 5 г: {sell}")
          print(f"Выкуп 5 г: {buy}")
          PY

      - name: Save data
        run: |
          git config user.name "gold-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update gold price"
          git push
